services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: soultoy
      MYSQL_USER: soultoy
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-soultoy_local}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-local_root_change_me}
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - soultoy-db:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      retries: 20
volumes:
  soultoy-db:
